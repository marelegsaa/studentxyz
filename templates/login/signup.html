{% extends 'base_login.html' %}

{% block head %}
{% endblock %}

{% block body %}
<section class="signup-container">
  <img class="signup-logo glow logo" src="{{url_for('static', filename='css/studentxyz.svg')}}" width="350" height="63"> </img>
  <form id="formularemail" class="info" method="POST" action="{{ url_for('signup') }}">
  <div class="input-section">
    <input id="nume" name="nume" type="text" placeholder="nume" required class="input">
    <input id="prenume" name="prenume" type="text" placeholder="prenume" required class="input">
    <select class="select" name="facultate" id="facultate" required>
      <option value="">--selectează facultatea--</option>
      <option value="csie">facultatea de cibernetică, statistică și informatică economică</option>
      <option value="finante">facultatea de finanțe, asigurări, bănci și burse de valori</option>
      <option value="marketing">facultatea de marketing</option>
      <option value="comert">facultatea de comerț</option>
      <option value="economie">facultatea de economie teoretică și aplicată</option>
      <option value="contabilitate">facultatea de contabilitate și informatică de gestiune</option>
      <option value="management">facultatea de management</option>
      <option value="rei">facultatea de relații economice internaționale</option>
      <option value="fabiz">facultatea de administrarea afacerilor în limbi străine (fabiz)</option>
    </select>
                      
    <select class="select hidden" name="specializare" id="specializare" required>
      <option value="">--selectează specializarea--</option>
    </select>
                      
    <select class="select hidden" name="an" id="an" required>
      <option value="">--selectează anul--</option>
      <option value="1">anul 1</option>
      <option value="2">anul 2</option>
      <option value="3">anul 3</option>
    </select>
    <input id="email" name="email" type="email" placeholder="nume@stud.ase.ro" required class="input">
    <input name="password" type="password" placeholder="parolă" required class="parola">
    <input name="confirm_password" type="password" placeholder="repetă parola" required class="parola">
  </div>
  <div id="email-error" class="eroare-email"></div>
  
  <div class="signup-spam-warning">
  emailul de confirmare ar putea intra în <strong>spam</strong>. verifica și <strong>folderul de spam/junk</strong> după ce te-ai înregistrat.
  </div>
  
  <div class="gdpr-consent-container">
    <label class="gdpr-consent-label">
      <input type="checkbox" name="gdpr_consent" required class="gdpr-consent-input">
      <span class="gdpr-consent-text">
        sunt de acord cu <a href="/privacy-policy" target="_blank" class="gdpr-link">Politica de Confidențialitate</a> 
        și <a href="/terms" target="_blank" class="gdpr-link">Termenii și Condițiile de Utilizare</a>
      </span>
    </label>
  </div>
  
  <a href="{{ url_for('login') }}" class="link signup-link" >ai deja cont?</a>
  <div class="button-section">
    <button type="submit" class="signup">înscrie-te</button>
  </div>
  </form>
  <p class="subtext">&copy; 2026 studentxyz - all rights reserved.</p>
</section>
{% endblock %}
